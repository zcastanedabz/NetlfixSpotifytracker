<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SubTrack">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F1F3F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B101A" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>SubTrack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column, sticky title bar, iOS-style bottom tab bar with a raised "Record payment" button; sheets slide up from the bottom. */
:root{
  --bg:#F1F3F8; --surface:#FFFFFF; --surface-2:#E8ECF5; --ink:#131A2B; --muted:#5A6378; --line:#DCE1EC;
  --accent:#2450E6; --accent-ink:#FFFFFF; --accent-soft:#E2E8FD;
  --over:#C4302A; --over-soft:#FBE5E3; --soon:#A86200; --soon-soft:#FCEFD6; --ok:#17804A; --ok-soft:#DDF2E5; --idle:#8A92A6; --idle-soft:#ECEEF3;
  --netflix:#D3252C; --spotify:#138F44; --other:#6A5AD0; --coin:#F4B400;
  --scrim:rgba(10,14,24,.45); --shadow:0 1px 2px rgba(19,26,43,.05),0 8px 24px rgba(19,26,43,.06);
  --f-display:"Bricolage Grotesque",ui-rounded,-apple-system,system-ui,sans-serif;
  --f-body:"Figtree",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --r:16px; --nav-h:62px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B101A; --surface:#141B29; --surface-2:#1C2536; --ink:#E8ECF6; --muted:#98A1B6; --line:#253048;
  --accent:#7094FF; --accent-ink:#0B101A; --accent-soft:#1C2850;
  --over:#FF7D73; --over-soft:#3A1B1D; --soon:#F0B04C; --soon-soft:#33270F; --ok:#4FCB86; --ok-soft:#12301F; --idle:#7F889C; --idle-soft:#1F2738;
  --netflix:#E5484D; --spotify:#2DBB61; --other:#8E81F2; --coin:#F4C542;
  --scrim:rgba(0,0,0,.6); --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B101A; --surface:#141B29; --surface-2:#1C2536; --ink:#E8ECF6; --muted:#98A1B6; --line:#253048;
  --accent:#7094FF; --accent-ink:#0B101A; --accent-soft:#1C2850;
  --over:#FF7D73; --over-soft:#3A1B1D; --soon:#F0B04C; --soon-soft:#33270F; --ok:#4FCB86; --ok-soft:#12301F; --idle:#7F889C; --idle-soft:#1F2738;
  --netflix:#E5484D; --spotify:#2DBB61; --other:#8E81F2; --coin:#F4C542;
  --scrim:rgba(0,0,0,.6); --shadow:none; color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.amt,.stat-val,.money{font-variant-numeric:tabular-nums}

#app{max-width:560px;margin:0 auto;padding-inline:16px;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 28px)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding-block:14px 10px;background:var(--bg)}
.top .logo{width:34px;height:34px;border-radius:9px;flex:none;display:block}
.top-text{flex:1;min-width:0}
.top h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:-.02em;line-height:1.1;text-wrap:balance}
.top p{margin:0;color:var(--muted);font-size:13px}
.icon-btn{width:40px;height:40px;border-radius:12px;border:0;background:var(--surface);color:var(--ink);display:grid;place-items:center;box-shadow:var(--shadow);flex:none}
.icon-btn svg{width:20px;height:20px}

h2.sec{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:-.01em;margin:22px 2px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
h2.sec small{font-family:var(--f-body);font-weight:500;font-size:13px;color:var(--muted)}

.banner{background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;display:grid;gap:10px;margin-top:4px}
.banner p{margin:0;font-size:14px}
.banner .btns{display:flex;gap:8px;flex-wrap:wrap}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat{background:var(--surface);border:0;border-radius:var(--r);padding:13px 14px;text-align:left;box-shadow:var(--shadow);display:grid;gap:2px;min-width:0}
.stat-lbl{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
.stat-lbl i{width:8px;height:8px;border-radius:50%;background:var(--idle);flex:none}
.stat.over .stat-lbl i{background:var(--over)} .stat.soon .stat-lbl i{background:var(--soon)} .stat.ok .stat-lbl i{background:var(--ok)} .stat.cash .stat-lbl i{background:var(--coin)}
.stat-val{font-family:var(--f-display);font-weight:800;font-size:30px;letter-spacing:-.02em;line-height:1.1}
.stat-sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.list{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.item{border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;background:none;border:0;text-align:left}
button.row:active{background:var(--surface-2)}
.row-main{flex:1;min-width:0}
.row-main>span{display:block}
.row-name{display:block;font-weight:600;overflow-wrap:anywhere}
.row-due{display:block;font-size:13px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.row-sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-end{display:grid;justify-items:end;gap:3px;flex:none}
.amt{font-weight:700;font-size:14px}
.row-actions{display:flex;gap:8px;padding:0 14px 12px 56px;flex-wrap:wrap}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}

.svc{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;color:#fff;font-family:var(--f-display);font-weight:800;font-size:15px;background:var(--other)}
.svc.netflix{background:var(--netflix)} .svc.spotify{background:var(--spotify)}
.svc.hollow{background:transparent;border:2px dashed var(--muted);color:var(--muted)}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap;background:var(--idle-soft);color:var(--muted)}
.pill.overdue{background:var(--over-soft);color:var(--over)}
.pill.soon{background:var(--soon-soft);color:var(--soon)}
.pill.ok,.pill.paid{background:var(--ok-soft);color:var(--ok)}
.pill.partial{background:var(--soon-soft);color:var(--soon)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 14px;border-radius:11px;border:0;font-weight:600;font-size:15px;background:var(--surface-2);color:var(--ink);text-decoration:none;white-space:nowrap}
.btn.sm{height:34px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--over-soft);color:var(--over)}
.btn.block{width:100%;height:48px;font-size:16px}
.btn svg{width:16px;height:16px}
.btn:active{transform:scale(.98)}

.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1 1 auto;min-width:0;border:0;background:transparent;height:34px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap;padding:0 6px}
.seg button:nth-last-child(4),.seg button:nth-last-child(4)~button{font-size:13px;padding:0 4px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);height:32px;padding:0 12px;border-radius:999px;font-size:14px;font-weight:600;white-space:nowrap;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.search{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font-size:16px;margin-top:12px}

/* calendar */
.cal-head{display:flex;align-items:center;gap:8px;margin-top:12px}
.cal-head h3{flex:1;margin:0;font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.01em}
.cal-sum{margin-top:10px;background:var(--surface);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);display:grid;gap:8px}
.cal-sum-row{display:flex;justify-content:space-between;font-size:14px;gap:10px}
.cal-sum-row b{font-variant-numeric:tabular-nums}
.meter{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.meter span{display:block;height:100%;background:var(--ok);border-radius:99px}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:14px;font-size:11px;font-weight:700;color:var(--muted);text-align:center;letter-spacing:.06em}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px}
.cal-day{position:relative;min-width:0;height:60px;border:0;border-radius:11px;background:var(--surface);display:flex;flex-direction:column;align-items:center;padding:6px 2px 4px;gap:3px}
.cal-day.blank{background:transparent;pointer-events:none}
.cal-day .n{font-size:14px;font-weight:600;width:24px;height:24px;display:grid;place-items:center;border-radius:50%;font-variant-numeric:tabular-nums}
.cal-day.today .n{background:var(--accent);color:var(--accent-ink)}
.cal-day.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.cal-day.past .n{color:var(--muted)}
.cal-day.today.past .n{color:var(--accent-ink)}
.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;max-width:100%}
.dot{width:6px;height:6px;border-radius:50%;background:var(--idle)}
.dot.overdue{background:var(--over)} .dot.soon,.dot.partial{background:var(--soon)} .dot.paid{background:var(--ok)} .dot.upcoming{background:var(--idle)}
.groups{display:grid;gap:14px}
.pw{font-family:ui-monospace,Menlo,monospace;font-size:14px;color:var(--ink);letter-spacing:.5px}
code.pw{background:var(--surface-2);padding:2px 6px;border-radius:6px;user-select:all;-webkit-user-select:all;overflow-wrap:anywhere}
.acct-head{display:flex;gap:12px;align-items:center;padding:14px 16px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.acct-head .btn{flex:none}
.acct-head .row-main{flex:1;min-width:0}
.acct-head .row-sub{white-space:normal;overflow-wrap:anywhere}
.acct-head .row-email{white-space:normal;overflow-wrap:anywhere}
.mem-actions{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 12px 64px;margin-top:-4px}
.acct-foot{padding:12px 16px}
.dot.gift{background:var(--coin);border-radius:2px}
.gift-ico{background:var(--coin)!important;color:#3A2A00!important}
.dot.renew{border-radius:1px;background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink)}
.cal-amt{font-size:9.5px;font-weight:700;color:var(--ok);line-height:1;white-space:nowrap;overflow:hidden;max-width:100%;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.day-title{font-family:var(--f-display);font-weight:700;font-size:17px;margin:20px 2px 8px}
.sub-lbl{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:14px 2px 6px}

/* reports */
.card{background:var(--surface);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.chart{width:100%;height:auto;display:block}
.chart .bar{fill:var(--accent-soft)} .chart .bar.cur{fill:var(--accent)}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.chart .val{fill:var(--ink);font-weight:700}
.chart .grid{stroke:var(--line);stroke-width:1}
.hbar{display:grid;gap:5px;padding:9px 0;border-bottom:1px solid var(--line)}
.hbar:last-child{border-bottom:0}
.hbar-top{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.hbar-track{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.hbar-track span{display:block;height:100%;border-radius:99px;background:var(--other)}
.hbar-track span.netflix{background:var(--netflix)} .hbar-track span.spotify{background:var(--spotify)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted)}
.kv b{font-variant-numeric:tabular-nums}

/* accounts */
.acct{padding:13px 14px;display:grid;gap:9px;width:100%;background:none;border:0;text-align:left}
.acct-top{display:flex;align-items:center;gap:12px}
.slots{display:flex;gap:4px}
.slots i{flex:1;height:8px;border-radius:3px;background:var(--surface-2)}
.slots i.on{background:var(--accent)}
.members{font-size:13px;color:var(--muted)}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h);align-items:center}
.tab{border:0;background:none;display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 0}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent)}
.tab.pay{position:relative}
.tab.pay .fab{width:52px;height:52px;border-radius:17px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:-26px;box-shadow:0 6px 18px rgba(36,80,230,.35)}
.tab.pay .fab svg{width:26px;height:26px}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:60}
.sheet-bg{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--surface);border-radius:22px 22px 0 0;max-height:92%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 16px calc(24px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:40px;height:5px;border-radius:99px;background:var(--line);margin:4px auto 10px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.sheet-h h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.02em;min-width:0}
.form{display:grid;gap:12px}
.form label{display:grid;gap:5px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
.form input,.form select,.form textarea{width:100%;min-width:0;font-size:16px;padding:11px 12px;border-radius:11px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-height:46px;-webkit-appearance:none;appearance:none}
.form select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.form textarea{min-height:90px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12.5px;color:var(--muted);font-weight:400;margin:0}
.preview{background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:14px;margin:0}
.detail-head{display:flex;gap:12px;align-items:center}
.detail-head .svc{width:44px;height:44px;border-radius:13px;font-size:20px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.phone{user-select:all;-webkit-user-select:all}
.set-group{display:grid;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}
.set-group:last-child{border-bottom:0}
.set-group h3{margin:0;font-family:var(--f-display);font-size:16px}
.export-box{width:100%;height:45vh;min-height:220px;font-family:ui-monospace,Menlo,monospace;font-size:12px;border-radius:11px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:10px}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 16px);z-index:80;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
@media (max-width:360px){.stat-val{font-size:25px}.cal-day{height:54px}}
</style>

<div id="app">
  <header class="top">
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2F5BFF"/><stop offset="1" stop-color="#1834BE"/></linearGradient></defs><rect width="64" height="64" rx="15" fill="url(#lg)"/><rect x="13" y="16.5" width="38" height="35" rx="6" fill="#fff"/><path d="M13 22.5a6 6 0 0 1 6-6h26a6 6 0 0 1 6 6v4.5H13z" fill="#131A2B"/><rect x="22" y="12.5" width="4" height="8" rx="2" fill="#C9D5FF"/><rect x="38.5" y="12.5" width="4" height="8" rx="2" fill="#C9D5FF"/><path d="M22.5 37.5l7 6.5 12-13" fill="none" stroke="#2450E6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="49.5" cy="49.5" r="10" fill="#1834BE"/><circle cx="49.5" cy="49.5" r="8.6" fill="#FFC53D"/><text x="49.5" y="53.6" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="11.5" fill="#131A2B">$</text></svg>
    <div class="top-text"><h1 id="pageTitle">SubTrack</h1><p id="pageSub"></p></div>
    <button class="icon-btn" id="btnSettings" data-action="settings" aria-label="Settings and backup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </header>
  <main id="view"></main>
</div>

<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const dim=(y,m)=>new Date(y,m+1,0).getDate();
function addMonths(s,n){const d=parse(s),day=d.getDate(),t=new Date(d.getFullYear(),d.getMonth()+n,1);t.setDate(Math.min(day,dim(t.getFullYear(),t.getMonth())));return iso(t)}
const diff=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const r2=n=>Math.round((+n||0)*100)/100;
const sum=a=>r2(a.reduce((x,y)=>x+(+y||0),0));
const fdate=(s,o)=>parse(s).toLocaleDateString('en-US',o||{month:'short',day:'numeric'});
const monthName=(ym,o)=>parse(ym+'-01').toLocaleDateString('en-US',o||{month:'long',year:'numeric'});
function money(n){n=r2(n);const neg=n<0;n=Math.abs(n);const s=Number.isInteger(n)?n.toLocaleString('en-US'):n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});return (neg?'-':'')+(S.settings.currency||'$')+s}
const svcKey=s=>/net/i.test(s)?'netflix':/spot/i.test(s)?'spotify':'other';
const svcLetter=s=>svcKey(s)==='netflix'?'N':svcKey(s)==='spotify'?'S':(String(s||'?').trim()[0]||'?').toUpperCase();
const cycleLabel=c=>({1:'Monthly',2:'Every 2 months',3:'Quarterly',6:'Every 6 months',12:'Yearly'})[c]||('Every '+c+' months');
const METHODS=['Cash','Bank transfer','DigiWallet','E-Kyash','Other'];
const ICON={wa:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-12.6 7.4L3 20.5l1.7-5.2A8.5 8.5 0 1 1 21 11.5z"/></svg>',
 check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
 left:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
 right:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
 mail:'<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>',
 x:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'};

/* ---------- storage ---------- */
const KEY='subtrack.v1';
let canSave=true;
function load(){try{const t=localStorage.getItem(KEY);return t?JSON.parse(t):null}catch(e){canSave=false;return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){canSave=false}}
function defaults(){return {settings:{currency:'BZ$',grace:2,template:'Hi {name}! Your {service} ({plan}) is due {date}. Amount: {amount}. Thank you!',sample:false,lastBackup:null,lastMethod:'Cash',dateFormat:'dmy'},customers:[],payments:[],accounts:[]}}

function sampleState(){
  const st=defaults(); st.settings.sample=true; const t=today();
  const acc=(name,service,cost,renewOff,slots)=>{const a={id:uid(),name,service,cost,cycle:1,renewDate:addDays(t,renewOff),slots,notes:''};st.accounts.push(a);return a};
  const n1=acc('Netflix Premium #1','Netflix',38,9,4), n2=acc('Netflix Premium #2','Netflix',38,21,4), s1=acc('Spotify Family A','Spotify',34,4,6);
  const people=[
    ['Maria Castillo','6102233','Netflix','1 profile',16,1,n1,-6,3,0,'Cash'],
    ['Andre Young','6224410','Spotify','Family slot',10,1,s1,-3,2,0,'E-Kyash'],
    ['Keisha Flowers','6015578','Netflix','1 profile',16,1,n1,-1,4,8,'DigiWallet'],
    ['Luis Novelo','6338821','Netflix','2 screens',28,1,n2,0,2,0,'Bank transfer'],
    ['Shanice Gordon','6507712','Spotify','Family slot',10,1,s1,2,5,0,'DigiWallet'],
    ['Carlos Chan','6129904','Spotify','Family slot',27,3,s1,5,1,0,'Cash'],
    ['Daniela Pech','6613345','Netflix','1 profile',16,1,n2,12,3,0,'E-Kyash'],
    ['Marcus Tillett','6041187','Spotify','Family slot',10,1,s1,18,4,0,'Cash'],
    ['Rosa Cal','6275530','Netflix','1 profile',16,1,n1,24,2,0,'Bank transfer'],
    ['Jermaine Usher','6419962','Spotify','Family slot',10,1,s1,-41,1,0,'Cash']
  ];
  people.forEach((p,ix)=>{const[name,phone,service,plan,price,cycle,a,nextOff,paid,partial,method]=p;
    const next=addDays(t,nextOff); const first=addMonths(next,-paid*cycle);
    const c={id:uid(),name,phone,service,plan,price,cycle,accountId:a.id,firstDue:first,active:true,notes:''};st.customers.push(c);
    for(let i=0;i<paid;i++){let d=addDays(addMonths(first,i*cycle),-((ix+i)%4));if(d>t)d=t;st.payments.push({id:uid(),customerId:c.id,amount:price,date:d,method,note:''})}
    if(partial)st.payments.push({id:uid(),customerId:c.id,amount:partial,date:addDays(t,-2),method,note:'Rest next week'});
  });
  return st;
}
/* Your data, imported from Spotify_Payments.xlsx. Loaded once on first open; after that everything lives in the app and is fully editable. */
const IMPORTED={"settings": {"currency": "BZ$", "grace": 2, "template": "¡Hola {name}! Tu pago de {service} vence el {date}. Monto: {amount}. ¡Gracias!", "reminderLang": "es", "lateTemplate": "¡Hola {name}! Tu pago de {service} venció el {date}. Monto pendiente: {amount}. ¡Gracias!", "giftCardCost": 30, "giftCardMonths": 2, "defaultMethod": "Cash", "importVersion": 8, "sample": false, "lastBackup": null, "lastMethod": "Cash", "dateFormat": "dmy", "importedFrom": null}, "customers": [], "payments": [], "accounts": []};
let S=load();
if(!S||!Array.isArray(S.customers)||(S.settings&&S.settings.sample)){S=JSON.parse(JSON.stringify(IMPORTED));S.log=[];save()}
S.settings=Object.assign(defaults().settings,S.settings||{});
S.accounts=S.accounts||[];S.payments=S.payments||[];
if(!S.settings.trackingSince){S.settings.trackingSince=today().slice(0,7);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
if(!S.settings.mig2){S.accounts.forEach(a=>{const k=svcKey(a.service);if(k==='spotify'&&/^family/i.test(a.name||'')&&(+a.slots===6||!+a.slots))a.slots=5;if(k==='spotify'&&/^duo/i.test(a.name||''))a.slots=1;if(k==='netflix'&&!+a.slots&&!/cancel/i.test(a.name||''))a.slots=4});S.settings.mig2=true;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
if(!S.settings.mig1){S.payments.forEach(p=>{if(/from sheet/i.test(p.note||'')&&p.method==='Other')p.method='From sheet';if(p.note==='From sheet'&&p.date==='2026-09-29')p.note='Paid ahead (exact date not in sheet)'});S.settings.mig1=true;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
try{const k='subtrack.safety.'+today();if(!localStorage.getItem(k)){localStorage.setItem(k,JSON.stringify(S));Object.keys(localStorage).filter(x=>x.startsWith('subtrack.safety.')).sort().slice(0,-7).forEach(x=>localStorage.removeItem(x))}}catch(e){}

/* ---------- derived data ---------- */
function priceAt(c,d){const h=c.prices;if(!h||!h.length)return +c.price||0;let p=null;for(const e of h){if(e.from<=d)p=e.price}return +(p==null?h[0].price:p)||0}
function simPeriods(c,total){const cyc=+c.cycle||1;let rem=total+1e-6,k=0;while(k<2400){const pr=priceAt(c,addMonths(c.firstDue,k*cyc));if(!(pr>0)||rem<pr)break;rem-=pr;k++}return {k,credit:r2(Math.max(0,rem-1e-6))}}
function info(c){
  const t=today(), price=+c.price||0, cyc=+c.cycle||1;
  const pays=S.payments.filter(p=>p.customerId===c.id).sort((a,b)=>a.date<b.date?1:-1);
  const total=sum(pays.map(p=>p.amount));
  const sp=price>0?simPeriods(c,total):{k:0,credit:r2(total)};
  const periods=sp.k, credit=price>0?sp.credit:0;
  const nextDue=addMonths(c.firstDue,periods*cyc);
  const days=diff(nextDue,t);
  let missed=0,owedSum=0; for(let k=periods;k<periods+240;k++){const d=addMonths(c.firstDue,k*cyc);if(d<=t){missed++;owedSum+=priceAt(c,d)}else break}
  let status; if(!c.active)status='paused'; else if(days< -S.settings.grace)status='overdue'; else if(days<=7)status='soon'; else status='ok';
  const owed=r2(Math.max(0,(missed?owedSum:priceAt(c,nextDue))-credit));
  return {pays,total,periods,credit,nextDue,days,missed,status,owed,lastPay:pays[0]?.date||null};
}
function statusText(i){
  if(i.status==='paused')return 'Paused';
  if(i.status==='ok')return 'Paid up';
  if(i.days<0)return (-i.days)+'d overdue';
  if(i.days===0)return 'Due today';
  if(i.days===1)return 'Due tomorrow';
  return 'Due in '+i.days+'d';
}
const pillCls=i=>i.status==='soon'&&i.days<0?'overdue':i.status;
function acctName(id){const a=S.accounts.find(a=>a.id===id);return a?a.name:''}
function acctEmail(id){const a=S.accounts.find(a=>a.id===id);return a?(a.email||''):''}
const isExtra=c=>/extra member/i.test(c.plan||'');
const slotWeight=c=>{const m=String(c.plan||'').match(/(\d+)\s*(profiles?|screens?|slots?)/i);if(m)return +m[1];if(/full account|whole account/i.test(c.plan||'')){const a=S.accounts.find(a=>a.id===c.accountId);return +(a&&a.slots)||4}return 1};
function slotUse(a){const act=S.customers.filter(c=>c.accountId===a.id&&c.active);return {used:sum(act.filter(c=>!isExtra(c)).map(slotWeight)),extras:act.filter(isExtra).length,people:act.length}}
function acctOption(a,selId){const su=slotUse(a),used=su.used;const free=+a.slots?(' · '+Math.max(0,a.slots-used)+' free'+(su.extras?' + '+su.extras+' extra':'')):(' · '+su.people+' users');
  return '<option value="'+a.id+'"'+(a.id===selId?' selected':'')+'>'+esc((a.email?a.email+' — ':'')+a.name+free)+'</option>'}
function acctOptions(service,selId){const list=S.accounts.filter(a=>svcKey(a.service)===svcKey(service)||a.id===selId);
  return '<option value="">No account</option>'+list.map(a=>acctOption(a,selId)).join('')+'<option value="__new">+ New full account (new email)</option>'}
function reminder(c,i){
  const first=(c.name||'').split(' ')[0];
  const tpl=i.days<0&&S.settings.lateTemplate?S.settings.lateTemplate:S.settings.template;
  return (tpl||'').replace(/\{name\}/g,first).replace(/\{service\}/g,c.service||'').replace(/\{plan\}/g,c.plan||'')
   .replace(/\{date\}/g,S.settings.reminderLang==='es'?parse(i.nextDue).toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'}):fdate(i.nextDue,{weekday:'short',month:'short',day:'numeric'})).replace(/\{amount\}/g,money(i.owed));
}
function waLink(c,i){let d=String(c.phone||'').replace(/\D/g,'');if(d.length===7)d='501'+d;return 'https://wa.me/'+d+'?text='+encodeURIComponent(reminder(c,i))}

function dueEvents(start,end){
  const out=[],t=today();
  for(const c of S.customers){
    if(!(+c.price>0))continue; const i=info(c), cyc=+c.cycle||1;
    const f=parse(c.firstDue),s=parse(start);
    let k=Math.max(0,Math.floor(((s.getFullYear()-f.getFullYear())*12+(s.getMonth()-f.getMonth()))/cyc)-1);
    for(let n=0;n<400;n++,k++){
      const d=addMonths(c.firstDue,k*cyc); if(d>end)break; if(d<start)continue;
      let st; if(k<i.periods)st='paid'; else if(!c.active)continue;
      else if(k===i.periods)st=i.credit>0?'partial':(i.status==='ok'?'upcoming':(d<t?'overdue':i.status));
      else st=d<t?'overdue':'upcoming';
      out.push({date:d,c,i,st,amount:priceAt(c,d)});
    }
  }
  return out;
}
function renewEvents(start,end){
  const out=[];
  for(const a of S.accounts){ if(a.gift||!a.renewDate)continue; const cyc=+a.cycle||1;
    const f=parse(a.renewDate),s=parse(start);
    let k=Math.floor(((s.getFullYear()-f.getFullYear())*12+(s.getMonth()-f.getMonth()))/cyc)-1;
    for(let n=0;n<200;n++,k++){const d=addMonths(a.renewDate,k*cyc);if(d>end)break;if(d<start)continue;out.push({date:d,a})}
  }
  return out;
}
const stLabel={paid:'Paid',overdue:'Overdue',soon:'Due',upcoming:'Upcoming',partial:'Part paid'};

/* ---------- UI state ---------- */
const U={custGroup:!!S.settings.custGroup,homeSvc:'all',tab:'home',calMonth:today().slice(0,7),calSel:today(),calMode:'month',custTab:'customers',filter:'all',q:''};
try{const h=location.hash.slice(1);if(['home','calendar','customers','reports'].includes(h))U.tab=h}catch(e){}






/* ---------- profit per account ---------- */
function acctIncome(a){return r2(sum(S.customers.filter(c=>c.active&&c.accountId===a.id).map(c=>(+c.price||0)/(+c.cycle||1))))}
function acctCostM(a){return r2((+a.cost||0)/(+a.cycle||1))}
function monthlyCosts(){return r2(sum(S.accounts.map(acctCostM)))}
/* ---------- gift card history ---------- */
function cardHistorySheet(id){const a=S.accounts.find(a=>a.id===id);if(!a)return;const log=[...(a.cardLog||[])].sort((x,y)=>x.date<y.date?1:-1);const y=today().slice(0,4);
  openSheet(sheetHead('Gift card history')+'<p class="hint" style="margin:0 0 10px">'+esc(a.name)+(a.email?' · '+esc(a.email):'')+'</p>'
   +'<div class="card" style="box-shadow:none;background:var(--bg);margin-bottom:12px"><div class="kv"><span>Cards loaded in '+y+'</span><b>'+log.filter(e=>e.date.startsWith(y)).length+'</b></div><div class="kv"><span>Spent on cards in '+y+'</span><b>'+money(sum(log.filter(e=>e.date.startsWith(y)).map(e=>e.amount||0)))+'</b></div><div class="kv"><span>Next card by</span><b>'+(a.cardDue?fdate(a.cardDue,{weekday:'short',month:'short',day:'numeric'}):'not set')+'</b></div></div>'
   +'<div class="list" style="box-shadow:none;border:1px solid var(--line)">'+(log.length?log.map(e=>'<div class="item"><div class="row"><span class="row-main"><span class="row-name">Loaded '+fdate(e.date,{month:'short',day:'numeric',year:'numeric'})+'</span><span class="row-sub" style="display:block">'+(e.next?'Next card was set for '+fdate(e.next,{month:'short',day:'numeric',year:'numeric'}):'')+'</span></span><span class="amt">'+(e.amount?money(e.amount):'—')+'</span><button class="btn sm danger" data-action="card-log-del" data-id="'+a.id+'" data-k="'+e.id+'">Delete</button></div></div>').join(''):'<div class="empty">No cards recorded yet. Tap <b>Card loaded</b> each time you load one.</div>')+'</div>');
}
function giftSpend(prefix){return r2(sum(S.accounts.flatMap(a=>(a.cardLog||[]).filter(e=>e.date.startsWith(prefix)).map(e=>+e.amount||0))))}
/* ---------- passwords (saved only on this phone) ---------- */
function viewPasswords(){
  const list=S.accounts.filter(a=>a.email||a.password).sort((x,y)=>svcKey(x.service).localeCompare(svcKey(y.service))||(x.name||'').localeCompare(y.name||''));
  let h='<p class="hint" style="margin:12px 2px 0">Login emails and passwords for your accounts. Saved <b>only on this phone</b>, never on the website. Hidden until you tap Show. Keep your iPhone locked with a passcode.</p>'
   +'<h2 class="sec"><span>'+list.length+' logins</span><button class="btn sm" data-action="pw-import">Paste list</button></h2><div class="list">';
  h+=list.length?list.map(a=>{const shown=U.showPw===a.id;return '<div class="item"><div class="row"><span class="svc '+svcKey(a.service)+'">'+esc(svcLetter(a.service))+'</span><span class="row-main"><span class="row-name">'+esc(a.name)+'</span>'
     +'<span class="row-sub row-email" style="display:block;white-space:normal;overflow-wrap:anywhere">'+ICON.mail+esc(a.email||'no email')+'</span>'
     +'<span class="row-sub pw-line" style="display:block">'+(a.password?(shown?'<code class="pw">'+esc(a.password)+'</code>':'<span class="pw">••••••••</span>'):'<i>No password saved</i>')+'</span></span></div>'
     +'<div class="row-actions">'+(a.password?'<button class="btn sm" data-action="pw-show" data-id="'+a.id+'">'+(shown?'Hide':'Show')+'</button><button class="btn sm" data-action="pw-copy" data-id="'+a.id+'">Copy password</button>':'')
     +(a.email?'<button class="btn sm" data-action="pw-copy-email" data-id="'+a.id+'">Copy email</button>':'')
     +'<button class="btn sm'+(a.password?'':' primary')+'" data-action="pw-edit" data-id="'+a.id+'">'+(a.password?'Change':'Add password')+'</button></div></div>'}).join(''):'<div class="empty">Add a login email to an account (Accounts › Edit) to save its password here.</div>';
  return h+'</div>';
}
function pwSheet(id){const a=S.accounts.find(a=>a.id===id);if(!a)return;
  openSheet(sheetHead('Password')+'<form class="form" id="pwForm" data-id="'+a.id+'"><p class="hint" style="margin:0">'+esc(a.name)+(a.email?' · '+esc(a.email):'')+'</p>'
   +'<label>Password<input id="pwVal" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" value="'+esc(a.password||'')+'"></label>'
   +'<button class="btn primary block" type="submit">Save password</button>'+(a.password?'<button class="btn danger block" type="button" data-action="pw-clear" data-id="'+a.id+'">Remove password</button>':'')+'</form>');
}
function pwImportSheet(){openSheet(sheetHead('Paste passwords')+'<p class="hint" style="margin:0 0 10px">One login per line: the email, a space, then the password. Accounts are matched by email.</p><textarea class="export-box" id="pwBox" placeholder="name@gmail.com  MyPassword1" style="min-height:160px;height:30vh"></textarea><div class="actions"><button class="btn primary" data-action="pw-import-go">Save passwords</button></div>')}
/* ---------- year summary ---------- */
function yearSummary(){
  const now=today(), Y=U.repYear||+now.slice(0,4), cy=+now.slice(0,4);
  const months=Array.from({length:12},(_,k)=>Y+'-'+pad(k+1));
  const vals=months.map(m=>sum(S.payments.filter(p=>p.date.slice(0,7)===m).map(p=>p.amount)));
  const upto=Y<cy?12:Y>cy?0:+now.slice(5,7);
  const since=S.settings.trackingSince||now.slice(0,7); const trackIdx=months.map((m,k)=>k).filter(k=>k<upto&&months[k]>=since);
  const collected=sum(vals), colSince=r2(sum(trackIdx.map(k=>vals[k]))), costs=r2(monthlyCosts()*trackIdx.length), profit=r2(colSince-costs);
  const counted=vals.slice(0,upto).map((v,k)=>({v,m:months[k]})).filter(x=>x.v>0);
  const best=counted.length?counted.reduce((a,b)=>b.v>a.v?b:a):null, worst=counted.length?counted.reduce((a,b)=>b.v<a.v?b:a):null;
  const firstPay={};S.payments.forEach(p=>{if(!firstPay[p.customerId]||p.date<firstPay[p.customerId])firstPay[p.customerId]=p.date});
  const started=Object.values(firstPay).filter(d=>d.startsWith(Y+'')).length;

  const active=S.customers.filter(c=>c.active);

  const topGot=Math.max(...svcs.map(x=>x.got),1);

  h+='<h2 class="sec">By service this month</h2><div class="card">'+(svcs.length?svcs.map(x=>'<div class="hbar"><div class="hbar-top"><span><b>'+x.s+'</b> · '+x.count+' active</span><b class="money">'+money(x.got)+'</b></div><div class="hbar-track"><span class="'+x.key+'" style="width:'+Math.round(x.got/topGot*100)+'%"></span></div></div>').join(''):'<div class="empty">No data yet.</div>')+'</div>';
  const pa=S.accounts.map(a=>({a,inc:acctIncome(a),cost:acctCostM(a)})).filter(x=>x.inc||x.cost).map(x=>Object.assign(x,{p:r2(x.inc-x.cost)})).sort((x,y)=>y.p-x.p);
  h+='<h2 class="sec">Profit per account <small>per month</small></h2><div class="list">'+(pa.length?pa.map(x=>'<div class="item"><button class="row" data-action="edit-acct" data-id="'+x.a.id+'"><span class="svc '+svcKey(x.a.service)+'">'+esc(svcLetter(x.a.service))+'</span><span class="row-main"><span class="row-name">'+esc(x.a.name)+'</span>'+(x.a.email?'<span class="row-sub row-email" style="display:block">'+ICON.mail+esc(x.a.email)+'</span>':'')+'<span class="row-sub" style="display:block">Earns '+money(x.inc)+' · costs '+(x.cost?money(x.cost):'<b style="color:var(--soon)">not set</b>')+'</span></span><span class="row-end"><b class="money" style="color:'+(x.p>=0?'var(--ok)':'var(--over)')+'">'+(x.p>=0?'+':'')+money(x.p)+'</b></span></button></div>').join('')
     +'<div class="item"><div class="row"><span class="row-main"><span class="row-name">Total</span></span><span class="row-end"><b class="money">'+money(sum(pa.map(x=>x.p)))+'</b></span></div></div>':'<div class="empty">Add accounts and put customers on them to see profit per account.</div>')+'</div>';
  const gm=giftSpend(ym), gy=giftSpend(ym.slice(0,4));
  h+='<h2 class="sec">Gift cards</h2><div class="card"><div class="kv"><span>Loaded this month</span><b>'+money(gm)+'</b></div><div class="kv"><span>Loaded this year</span><b>'+money(gy)+'</b></div><p class="hint" style="margin:8px 0 0">Counted from cards you record with <b>Card loaded</b>. See each account\u2019s history in Customers › Gift cards.</p></div>';
  const mk=Object.keys(methods);

  h+='<h2 class="sec">Stopped paying <small>2+ missed payments</small></h2><div class="list">'+(lapsed.length?lapsed.map(r=>'<div class="item"><button class="row" data-action="open-cust" data-id="'+r.c.id+'"><span class="svc '+svcKey(r.c.service)+'">'+esc(svcLetter(r.c.service))+'</span><span class="row-main"><span class="row-name" style="display:block">'+esc(r.c.name)+'</span><span class="row-sub" style="display:block">Last paid '+(r.i.lastPay?fdate(r.i.lastPay,{month:'short',day:'numeric',year:'numeric'}):'never')+'</span></span><span class="row-end"><span class="pill overdue">'+r.i.missed+' missed</span><span class="amt">'+money(r.i.owed)+'</span></span></button></div>').join(''):'<div class="empty">No one has missed two payments.</div>')+'</div>';
  return h;

function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}

function setPayDefault(){const c=S.customers.find(c=>c.id===$('#payCust').value);if(c)$('#payAmt').value=info(c).owed}
function updatePayPreview(){
  const c=S.customers.find(c=>c.id===$('#payCust')?.value); const el=$('#payPreview'); if(!c||!el)return;
  const i=info(c), amt=+$('#payAmt').value||0, price=priceAt(c,i.nextDue);
  if(!(price>0)){el.textContent='Set a price for this customer to track due dates.';return}
  const sim=simPeriods(c,i.total+amt), per=sim.k, cr=sim.credit, nd=addMonths(c.firstDue,per*c.cycle), covered=per-i.periods;
  let s='Currently due '+fdate(i.nextDue,{month:'short',day:'numeric'})+'. ';

  else s+='Covers '+covered+' period'+(covered>1?'s':'')+'. Next due <b>'+fdate(nd,{weekday:'short',month:'short',day:'numeric'})+'</b>'+(cr>0?', with '+money(cr)+' credit toward it.':'.');
  el.innerHTML=s;
}

function csvCell(v){v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function exportData(k){
  let name,text,mime='text/csv';const d=today();

function parseCSV(text){const rows=[];let row=[],f='',q=false;for(let i=0;i<text.length;i++){const ch=text[i];if(q){if(ch==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}else if(ch==='"')q=true;else if(ch===','){row.push(f);f=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=ch}if(f!==''||row.length){row.push(f);rows.push(row)}return rows.filter(r=>r.some(x=>x.trim()))}
function toISO(v){v=String(v||'').trim();let m;
  if(m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))return m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);
  if(m=v.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/)){let a=+m[1],b=+m[2],y=+m[3];if(y<100)y+=2000;let d,mo;if(S.settings.dateFormat==='mdy'){mo=a;d=b}else{d=a;mo=b}if(mo>12){[d,mo]=[mo,d]}return y+'-'+pad(mo)+'-'+pad(d)}
  const t=Date.parse(v);return isNaN(t)?null:iso(new Date(t))}
function importCSV(text){

  let iName=hd.findIndex(h=>/name|customer|client/.test(h)&&!/plan|account/.test(h));
  const ix={phone:col('phone','whatsapp','number','cell','contact'),service:col('service','app'),plan:col('plan','package','type'),price:col('price','amount','cost','fee','rate'),cycle:col('cycle','billing','frequency','period'),due:col('next due','due','renew','expir'),acct:col('account'),notes:col('note','comment')};
  if(iName<0)iName=0;

  let n=0;
  rows.slice(1).forEach(r=>{const g=k=>ix[k]>=0?String(r[ix[k]]||'').trim():'';const name=String(r[iName]||'').trim();if(!name)return;
    let service=g('service')||g('plan'); service=svcKey(service)==='netflix'?'Netflix':svcKey(service)==='spotify'?'Spotify':(g('service')||'Other');
    const price=parseFloat(g('price').replace(/[^\d.]/g,''))||0;
    const cy=g('cycle').toLowerCase();let cycle=parseInt(cy)||(/year|annual/.test(cy)?12:/half|6/.test(cy)?6:/quarter/.test(cy)?3:1);
    let acctId='';const an=g('acct');if(an){let a=S.accounts.find(a=>a.name.toLowerCase()===an.toLowerCase());if(!a){a={id:uid(),name:an,service,cost:0,cycle:1,renewDate:'',slots:0,notes:''};S.accounts.push(a)}acctId=a.id}
    S.customers.push({id:uid(),name,phone:g('phone'),service,plan:g('plan'),price,cycle,accountId:acctId,firstDue:toISO(g('due'))||today(),active:true,notes:g('notes')});n++});
  save();closeSheet();U.tab='customers';U.custTab='customers';U.filter='all';render();

}
